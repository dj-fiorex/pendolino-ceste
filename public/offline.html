<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf8f3" />
    <title>Connessione assente · Pendolino</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        background: #faf8f3;
        color: #262a20;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
      }
      main {
        width: 100%;
        max-width: 28rem;
      }
      h1 {
        font-size: 2rem;
        line-height: 1.2;
      }
      p {
        line-height: 1.6;
      }
      button {
        width: 100%;
        min-height: 48px;
        margin-top: 16px;
        border: 0;
        border-radius: 10px;
        background: #4a6741;
        color: white;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid currentColor;
        outline-offset: 4px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #1c1f18;
          color: #faf8f3;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p>Pendolino Ceste</p>
      <h1>Connessione assente</h1>
      <p>
        Per aprire Pendolino serve una connessione. Quando torna, potrai
        riprendere il lavoro salvato su questo dispositivo.
      </p>
      <button type="button" id="retry">Riprova</button>
      <p id="status" role="status"></p>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", () => {
        document.getElementById("status").textContent =
          "Verifico la connessione…";
        if (location.pathname === "/offline.html") location.replace("/");
        else location.reload();
      });
    </script>
  </body>
</html>
